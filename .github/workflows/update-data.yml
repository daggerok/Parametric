name: Update Parametric ETF data

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      controls:
        description: 'JSON object with any updater controls, e.g. {"TICKERS":"PAPI PEPS","MAX_FETCHES":0,"AUM":"small"}; blank inherits scripts/update-data.config.json'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run updater unit tests
        run: bun test
      - name: Resolve file defaults and manual overrides
        env:
          CONTROLS: ${{ inputs.controls }}
        run: |
          bun --eval '
            import { resolveControls } from "./scripts/update-data.ts";
            import { appendFile } from "node:fs/promises";
            const controls = JSON.parse(process.env.CONTROLS?.trim() || "{}");
            const file = await Bun.file("scripts/update-data.config.json").json();
            const resolved = resolveControls(file, controls);
            await appendFile(process.env.GITHUB_ENV,
              Object.entries(resolved).map(([key, value]) => `${key}=${value}\n`).join(""));
          '
      - name: Generate api/parametric static data
        run: bun ./scripts/update-data.ts
      - name: Commit updated data
        if: ${{ !cancelled() }}
        run: |
          git add api/parametric
          if git diff --cached --quiet -- api/parametric; then
            echo "api/parametric is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): update Parametric ETF data"
          git push
