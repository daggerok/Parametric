name: TEMP probe (delete before PR)

on:
  push:
    branches: [arena/01a0f9b5-parametric]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe-parametric
  cancel-in-progress: false

jobs:
  probe:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Capture live provider payloads via direct + proxy fallbacks
        run: |
          set -u
          rm -rf probe && mkdir -p probe
          python3 - <<'PY'
          import json, re, os, time, urllib.request, urllib.parse

          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          SEC_UA = "DaggerOk Parametric ETF feed admin@daggerok.example.com"
          manifest = []

          def strip_jina(text):
              idx = text.find("Markdown Content:")
              if idx >= 0:
                  return text[idx + len("Markdown Content:"):].lstrip()
              return text

          def fetch_with_fallback(name, url, is_sec=False, is_json=False):
              candidates = [
                  ("direct", url),
                  ("allorigins", f"https://api.allorigins.win/raw?url={urllib.parse.quote(url, safe='')}"),
                  ("jina-https", f"https://r.jina.ai/https://{re.sub(r'^https?://', '', url)}"),
                  ("jina-http", f"https://r.jina.ai/http://{re.sub(r'^https?://', '', url)}"),
              ]
              if "query1.finance.yahoo.com" in url:
                  candidates.insert(1, ("yahoo-q2", url.replace("query1.finance.yahoo.com", "query2.finance.yahoo.com")))

              for kind, cand in candidates:
                  time.sleep(1.5)
                  headers = {
                      "User-Agent": SEC_UA if (is_sec and kind == "direct") else UA,
                      "Accept": "application/json,*/*" if is_json else "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                      "Accept-Language": "en-US,en;q=0.9",
                  }
                  try:
                      req = urllib.request.Request(cand, headers=headers)
                      with urllib.request.urlopen(req, timeout=60) as resp:
                          raw = resp.read().decode("utf-8", errors="ignore")
                          status = resp.status
                          body = strip_jina(raw) if kind.startswith("jina") else raw
                          if len(body) > 200 and "Access Denied" not in body[:400] and "Too Many Requests" not in body[:200]:
                              open(f"probe/{name}", "w", encoding="utf-8").write(body)
                              manifest.append(f"{name}\t{status}\t{kind}\t{len(body)}\t{url}")
                              print(f"OK {name} via {kind} len={len(body)}")
                              return body
                          else:
                              manifest.append(f"{name}\t{status}-blocked\t{kind}\t{len(body)}\t{url}")
                  except Exception as e:
                      manifest.append(f"{name}\terr:{e}\t{kind}\t0\t{url}")
              print(f"FAIL {name} {url}")
              return ""

          # 1. Fetch Eaton Vance ETF catalog and 3 Parametric ETF pages
          fetch_with_fallback("ev-etfs.md", "https://www.eatonvance.com/products/etfs.html")
          fetch_with_fallback("papi.md", "https://www.eatonvance.com/products/etfs/us-equity/parametric-equity-premium-income-etf.html")
          fetch_with_fallback("pheq.md", "https://www.eatonvance.com/products/etfs/us-equity/parametric-hedged-equity-etf.html")
          fetch_with_fallback("peps.md", "https://www.eatonvance.com/products/etfs/us-equity/parametric-equity-plus-etf.html")

          # 2. Fetch Yahoo Finance chart API for PAPI, PHEQ, PEPS
          for t in ["PAPI", "PHEQ", "PEPS"]:
              y_raw = fetch_with_fallback(f"yahoo-{t}.json", f"https://query1.finance.yahoo.com/v8/finance/chart/{t}?range=max&interval=1d&events=div%7Csplit", is_json=True)
              if y_raw:
                  try:
                      yd = json.loads(y_raw)
                      res0 = yd["chart"]["result"][0]
                      meta = res0["meta"]
                      ts = res0.get("timestamp", [])
                      divs = res0.get("events", {}).get("dividends", {})
                      summary = {
                          "symbol": meta.get("symbol"),
                          "exchangeName": meta.get("exchangeName"),
                          "fullExchangeName": meta.get("fullExchangeName"),
                          "regularMarketPrice": meta.get("regularMarketPrice"),
                          "regularMarketTime": meta.get("regularMarketTime"),
                          "firstTradeDate": meta.get("firstTradeDate"),
                          "daysCount": len(ts),
                          "dividendsCount": len(divs),
                      }
                      json.dump(summary, open(f"probe/yahoo-{t}-summary.json", "w"), indent=2)
                      # Remove bulky raw yahoo file after saving summary + last 5 days fixture
                      q = res0["indicators"]["quote"][0]
                      ac = res0["indicators"].get("adjclose", [{}])[0].get("adjclose", [])
                      sample = {
                          "chart": {
                              "result": [{
                                  "meta": meta,
                                  "timestamp": ts[-10:],
                                  "indicators": {
                                      "quote": [{"close": q["close"][-10:], "volume": q["volume"][-10:]}],
                                      "adjclose": [{"adjclose": ac[-10:]}]
                                  },
                                  "events": res0.get("events", {})
                              }]
                          }
                      }
                      json.dump(sample, open(f"probe/yahoo-{t}-sample.json", "w"), indent=2)
                      os.remove(f"probe/yahoo-{t}.json")
                  except Exception as e:
                      manifest.append(f"yahoo-{t}-parse-err: {e}")

          # 3. Fetch SEC EDGAR company_tickers_mf.json & CIK0001676326 submissions
          mf_raw = fetch_with_fallback("sec-mf-raw.json", "https://www.sec.gov/files/company_tickers_mf.json", is_sec=True, is_json=True)
          series_map = {}
          if mf_raw:
              try:
                  mf = json.loads(mf_raw)
                  fields = mf.get("fields", [])
                  rows = [r for r in mf.get("data", []) if str(r[0]) == "1676326" or str(r[3]).upper() in ("PAPI", "PHEQ", "PEPS")]
                  json.dump({"fields": fields, "data": rows}, open("probe/sec-mf-tickers.json", "w"), indent=2)
                  for r in rows:
                      if str(r[3]).upper() in ("PAPI", "PHEQ", "PEPS"):
                          series_map[str(r[3]).upper()] = r[1]
              except Exception as e:
                  manifest.append(f"sec-mf-parse-err: {e}")
              if os.path.exists("probe/sec-mf-raw.json"):
                  os.remove("probe/sec-mf-raw.json")

          sub_raw = fetch_with_fallback("sec-sub-raw.json", "https://data.sec.gov/submissions/CIK0001676326.json", is_sec=True, is_json=True)
          if sub_raw:
              try:
                  sub = json.loads(sub_raw)
                  recent = sub.get("filings", {}).get("recent", {})
                  forms = recent.get("form", [])
                  accs = recent.get("accessionNumber", [])
                  fDates = recent.get("filingDate", [])
                  rDates = recent.get("reportDate", [])
                  docs = recent.get("primaryDocument", [])
                  nports = []
                  for i, f in enumerate(forms):
                      if "NPORT" in f or "N-PORT" in f:
                          nports.append({
                              "form": f,
                              "accessionNumber": accs[i],
                              "filingDate": fDates[i],
                              "reportDate": rDates[i],
                              "primaryDocument": docs[i],
                          })
                  json.dump({"cik": sub.get("cik"), "name": sub.get("name"), "nports": nports[:40]}, open("probe/sec-submissions-summary.json", "w"), indent=2)
              except Exception as e:
                  manifest.append(f"sec-sub-parse-err: {e}")
              if os.path.exists("probe/sec-sub-raw.json"):
                  os.remove("probe/sec-sub-raw.json")

          # 4. For each series in series_map, resolve latest N-PORT-P accession and fetch primary_doc.xml
          for ticker, series_id in series_map.items():
              atom_raw = fetch_with_fallback(f"sec-atom-{ticker}.xml", f"https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK={series_id}&type=NPORT-P&count=10&output=atom", is_sec=True)
              acc_m = re.search(r'(\d{10}-\d{2}-\d{6})', atom_raw)
              if acc_m:
                  acc = acc_m.group(1)
                  acc_digits = acc.replace("-", "")
                  xml_url = f"https://www.sec.gov/Archives/edgar/data/1676326/{acc_digits}/primary_doc.xml"
                  nport_raw = fetch_with_fallback(f"nport-{ticker}.xml", xml_url, is_sec=True)
                  if nport_raw:
                      invs = re.findall(r'<invstOrSec\b.*?</invstOrSec>', nport_raw, re.S)
                      manifest.append(f"nport-{ticker}\t{series_id}\t{acc}\tinvs={len(invs)}")
                      # Save header + first 5 invstOrSec items as compact fixture
                      head_end = nport_raw.find("<invstOrSec")
                      tail_start = nport_raw.rfind("</invstOrSec>")
                      if head_end > 0 and len(invs) > 5:
                          compact = nport_raw[:head_end] + "\n".join(invs[:5]) + "\n</invstOrSecs></formData></edgarSubmission>\n"
                          open(f"probe/nport-{ticker}-sample.xml", "w", encoding="utf-8").write(compact)
                          os.remove(f"probe/nport-{ticker}.xml")

          open("probe/manifest.txt", "w", encoding="utf-8").write("\n".join(manifest) + "\n")
          PY

      - name: Commit probe results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A probe
          if git diff --cached --quiet; then
            echo "No probe changes"
            exit 0
          fi
          git commit -m "chore(probe): capture live Parametric payloads via fallback [skip ci]"
          git push origin HEAD:arena/01a0f9b5-parametric
