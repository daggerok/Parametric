# TEMPORARY live acceptance workflow — deleted before the pull request.
#
# The implementation sandbox has no route to the ETF providers (its egress
# allowlist answers SSL_ERROR_SYSCALL), so the mandatory live acceptance runs
# here, on a GitHub runner, and publishes its evidence back to the branch:
#   1. an isolated copy of the updater runs twice for a scoped ticker set
#      (PAPI, PHEQ, PEPS) and both runs must be byte-identical;
#   2. the same command then runs in the working tree to produce the published
#      api/parametric seed, and is repeated once more as the byte-stability
#      witness.
# Both comparisons are reported twice: raw, and with the run's own
# "generatedAt" timestamp masked, so timestamp-only churn cannot masquerade as
# a data change (and a real value change cannot hide behind the timestamp).
name: TEMP live acceptance (delete before PR)

on:
  push:
    branches: [arena/01a0f9b5-parametric]
    paths:
      - .github/workflows/acceptance.yml
      - scripts/update-data.ts
      - scripts/update-data.config.json
  workflow_dispatch:

permissions: { contents: write }
concurrency: { group: acceptance-parametric, cancel-in-progress: true }

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Full generation in the working tree (published seed)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rc=0; bun scripts/update-data.ts > /tmp/full1.log 2>&1 || rc=$?; echo "$rc" > /tmp/rc-full1
          find api/parametric -type f | sort | xargs -r sha256sum > /tmp/full-hashes1.txt
          cp -R api/parametric /tmp/after-full1
      - name: Isolated scoped run, twice, byte-compared
        run: |
          set -euo pipefail
          rm -rf /tmp/accept && mkdir -p /tmp/accept
          cp -R scripts /tmp/accept/scripts
          mkdir -p /tmp/accept/api
          cp -R "$GITHUB_WORKSPACE"/api/parametric /tmp/accept/api/parametric
          cd /tmp/accept
          rc=0; TICKERS="PAPI PHEQ PEPS" VERBOSE=1 bun scripts/update-data.ts > /tmp/accept/run1.log 2>&1 || rc=$?; echo "$rc" > /tmp/accept/rc1
          find api -type f | sort | xargs -r sha256sum > /tmp/accept/hashes1.txt
          rc=0; TICKERS="PAPI PHEQ PEPS" VERBOSE=1 bun scripts/update-data.ts > /tmp/accept/run2.log 2>&1 || rc=$?; echo "$rc" > /tmp/accept/rc2
          find api -type f | sort | xargs -r sha256sum > /tmp/accept/hashes2.txt
      - name: Repeat the full generation (byte-stability witness)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rc=0; bun scripts/update-data.ts > /tmp/full2.log 2>&1 || rc=$?; echo "$rc" > /tmp/rc-full2
          find api/parametric -type f | sort | xargs -r sha256sum > /tmp/full-hashes2.txt
      - name: Publish the evidence
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          mkdir -p evidence/live
          REPORT=evidence/live/acceptance.txt

          # Hash every file again with the run's own generatedAt masked, so the
          # report distinguishes timestamp churn from a real data change.
          norm() { # <hashes-file> <root-dir>
            while read -r _ _ path; do
              [ -n "$path" ] || continue
              printf '%s  %s\n' "$(sed -E 's/"generatedAt": "[^"]*"/"generatedAt": "-"/' "$2/$path" | sha256sum | cut -d' ' -f1)" "$path"
            done < "$1"
          }
          norm /tmp/accept/hashes1.txt /tmp/accept > /tmp/accept/norm1.txt
          norm /tmp/accept/hashes2.txt /tmp/accept > /tmp/accept/norm2.txt
          norm /tmp/full-hashes1.txt "$GITHUB_WORKSPACE" > /tmp/full-norm1.txt
          norm /tmp/full-hashes2.txt "$GITHUB_WORKSPACE" > /tmp/full-norm2.txt

          {
            echo "Parametric live acceptance — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run: $GITHUB_RUN_ID commit: $GITHUB_SHA runner: ${RUNNER_NAME:-unknown} bun: $(bun --version)"
            echo
            echo '== isolated scoped runs: TICKERS="PAPI PHEQ PEPS" VERBOSE=1 bun scripts/update-data.ts =='
            echo "exit codes: run1=$(cat /tmp/accept/rc1) run2=$(cat /tmp/accept/rc2)"
            STABLE=no; diff -q /tmp/accept/hashes1.txt /tmp/accept/hashes2.txt >/dev/null && STABLE=yes
            STABLE_NORM=no; diff -q /tmp/accept/norm1.txt /tmp/accept/norm2.txt >/dev/null && STABLE_NORM=yes
            echo "byte-stable: $STABLE (ignoring generatedAt: $STABLE_NORM)"
            echo "config: $(awk '/^\[ config/{p=1} p&&/^\[ [a-z]/&&!/^\[ config/{p=0} p{print}' /tmp/accept/run1.log | tr '\n' ' ' | sed 's/  */ /g')"
            echo "files: $(wc -l < /tmp/accept/hashes1.txt) json files"
            echo "hashes (run 1 == run 2):"
            cat /tmp/accept/hashes1.txt
            echo "-- fund reporter lines --"
            grep -aE '^\[ +[0-9]+/' /tmp/accept/run1.log || true
            echo "-- provider provenance (isolated run) --"
            grep -aE '^\[ (catalog|issuer|edgar|yahoo|proxy)' /tmp/accept/run1.log | sort -u | head -20 || true
            echo "-- provider warnings / fallbacks --"
            grep -aiE 'warn|fallback|retry|refus' /tmp/accept/run1.log | grep -v EDGAR_FALLBACK | head -20 || true
            echo
            echo "== full generation: bun scripts/update-data.ts (published api/parametric seed) =="
            echo "exit codes: pass1=$(cat /tmp/rc-full1) pass2=$(cat /tmp/rc-full2)"
            FULL_STABLE=no; diff -q /tmp/full-hashes1.txt /tmp/full-hashes2.txt >/dev/null && FULL_STABLE=yes
            FULL_STABLE_NORM=no; diff -q /tmp/full-norm1.txt /tmp/full-norm2.txt >/dev/null && FULL_STABLE_NORM=yes
            echo "byte-stable pass1->pass2: $FULL_STABLE (ignoring generatedAt: $FULL_STABLE_NORM)"
            echo "config: $(awk '/^\[ config/{p=1} p&&/^\[ [a-z]/&&!/^\[ config/{p=0} p{print}' /tmp/full1.log | tr '\n' ' ' | sed 's/  */ /g')"
            grep -aE '^\[ catalog|^\[ done|^\[ filter' /tmp/full1.log || true
            python3 -c "import json; d=json.load(open('api/parametric/index.json')); print('published counts:', d['counts']); [print(' ', f['ticker'], 'holdings=' + str(f['holdings']), 'history=' + str(f['history']), 'ter=' + str(f.get('terValue')), 'aum=' + str(f.get('aumValue')), 'divs=' + str((f.get('distributions') or {}).get('frequency'))) for f in d['funds']]"
            echo "-- fund reporter lines (full) --"
            grep -aE '^\[ +[0-9]+/' /tmp/full1.log || true
            echo "-- provider provenance (full run) --"
            grep -aE '^\[ (catalog|issuer|edgar|yahoo|proxy)' /tmp/full1.log | sort -u | head -20 || true
            if [ "$FULL_STABLE" = no ]; then
              echo "-- changed files pass1 -> pass2 --"
              diff /tmp/full-hashes1.txt /tmp/full-hashes2.txt | head -20 || true
              if [ "$FULL_STABLE_NORM" = yes ]; then
                echo "(only the generatedAt run timestamp changed)"
              fi
              for changed in $(diff /tmp/full-hashes1.txt /tmp/full-hashes2.txt | awk '/^>/{print $3}'); do
                echo "-- diff ${changed} (pass1 -> pass2, first 30 lines) --"
                diff -u "/tmp/after-full1/${changed#api/parametric/}" "$changed" | head -30 || true
              done
            fi
            cp /tmp/full-hashes1.txt evidence/live/hashes-1.json 2>/dev/null || true
            cp /tmp/full-hashes2.txt evidence/live/hashes-2.json 2>/dev/null || true
            echo "-- provider warnings / fallbacks (full) --"
            grep -aiE 'warn|fallback|retry|refus' /tmp/full1.log | grep -v EDGAR_FALLBACK | head -20 || true
          } >> "$REPORT"
      - name: Commit and push the feed and the evidence
        run: |
          set -euo pipefail
          git add api/parametric evidence/live
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): publish the Parametric feed and live acceptance evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
